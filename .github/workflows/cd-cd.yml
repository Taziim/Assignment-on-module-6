name: Full CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      
  workflow_dispatch:

jobs:

  # -------------------------
  # TEST + BUILD JOB
  # -------------------------
  build:
    name: Build React + Backend
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # SETUP NODE
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: |
          npm install --force --legacy-peer-deps

      # -------------------------
      # BUILD FRONTEND
      # -------------------------
      - name: Build React App
        working-directory: ./frontend
        run: npm run build

      # # -------------------------
      # # DEBUG
      # # -------------------------
      # - name: Debug files
      #   run: |
      #     pwd
      #     ls -la
      #     cat package.json

      # -------------------------
      # BACKEND SETUP (if exists)
      # -------------------------
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          if [ -d "backend" ]; then
            cd backend
            npm install --force --legacy-peer-deps
          fi

      # -------------------------
      # UPLOAD BUILD ARTIFACT
      # -------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/
          retention-days: 7


  # -------------------------
  # DEPLOYMENT JOB
  # -------------------------
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # DOWNLOAD BUILD ARTIFACT
      # -------------------------
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: dist/

      # -------------------------
      # COPY FILES TO EC2 (FRONTEND)
      # -------------------------
      - name: Deploy Frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/home/ec2-user/app/frontend"

      # -------------------------
      # COPY BACKEND TO EC2
      # -------------------------
      - name: Deploy Backend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/*"
          target: "/home/ec2-user/app/backend"

      # -------------------------
      # SSH INTO EC2 & RESTART SERVICES
      # -------------------------
      - name: Restart Application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Deploying application..."

            # Frontend setup (Nginx path example)
            sudo cp -r /home/ec2-user/app/frontend/* /usr/share/nginx/html/

            # Backend setup
            cd /home/ec2-user/app/backend
            npm install --force --legacy-peer-deps

            # Restart backend using PM2
            pm2 restart all || pm2 start app.js --name backend

            echo "Deployment completed successfully!"